name: IOC Collection

on:
  schedule:
    - cron: '0 12,16 * * *'  # 12:00 & 16:00 UTC
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare runtime dirs
        run: mkdir -p data/logs output

      - name: Run collection
        run: |
          python -m iocbot.cli --json 2>&1 | tee data/logs/cron.log
          exit ${PIPESTATUS[0]}

      - name: Publish cycle summary
        if: always()
        run: |
          SUMMARY="$(ls -1 output/daily/*/IOC_SUMMARY.txt 2>/dev/null | tail -1 || true)"
          if [ -n "$SUMMARY" ]; then
            { echo '## IOC collection cycle'; echo; echo '```'; cat "$SUMMARY"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No IOC_SUMMARY.txt produced - the cycle did not complete.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iocbot-daily-${{ github.run_id }}
          path: |
            output/
            data/logs/
            data/state.db
          retention-days: 7
          if-no-files-found: warn
