# Optional outbound push of the IOC feed to SIEM destinations.
# The pull API (config/api.yaml) is the primary path: any SIEM with an API key
# can poll GET /api/v1/iocs?format=csv|json|stix. Use this file for SIEMs that
# should receive the feed instead.
#
# Rows pushed are filtered by `min_severity` and `view`
# (view: master | c2 | malware | importable).

enabled: false
min_severity: HIGH
view: importable
batch_limit: 5000

targets: []
