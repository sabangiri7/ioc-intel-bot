# Validation rules: false-positive gates for the IOC collector

# RFC 2606 / 6761 documentation and example names
doc_domains:
  - example.com
  - example.org
  - example.net
  - example.edu
  - example.info
  - example.biz
  - example.name
  - example.pro
  - test.com
  - test.org
  - test.net
  - local
  - domain.com
  - website.com
  - yourdomain.com
  - yourwebsite.com
  - sampledomain.com
  - registrable.example

# Single-label / reserved literals
blocked_literals:
  - localhost
  - local
  - test
  - invalid
  - example
  - broadcasthost
  - ip6-localhost
  - ip6-loopback
  - intranet
  - internal
  - lan
  - home
  - corp

# Reserved TLDs / suffixes never valid as public indicators
blocked_suffixes:
  - local
  - localhost
  - test
  - invalid
  - example
  - internal
  - intranet
  - lan
  - home
  - corp
  - onion
  - i2p

